<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Road Clicker</title>
    <link rel="stylesheet" href="Chill.css">

    <style>

        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

        }

        body{

            overflow:hidden;

            font-family:Arial,sans-serif;

        }

        .game{

            height:100vh;

            display:flex;

            flex-direction:column;

        }

        /* =========================
        
           SKY
        
        ========================= */

        .sky{

            position:relative;

            flex:1;

            background:#41c6c9;

            overflow:hidden;

        }

        /* COOKIE AREA */

        .cookie-area{

            position:absolute;

            left:4%;

            top:8%;

            width:32%;

            aspect-ratio:1;

            border:8px solid #ddd;

            background:rgba(255,255,255,.15);

            display:flex;

            align-items:center;

            justify-content:center;

        }

        .cookie{

            font-size:clamp(80px,10vw,170px);

            background:none;

            border:none;

            cursor:pointer;

            transition:.08s;

            user-select:none;

        }

        .cookie:active{

            transform:scale(.92);

        }

        .cookie.pop{

            animation:pop .15s;

        }

        @keyframes pop{

            50%{

                transform:scale(1.15);

            }

        }

        .floating{

            position:absolute;

            font-weight:bold;

            color:white;

            pointer-events:none;

            animation:floatUp 1s forwards;

        }

        @keyframes floatUp{

            from{

                opacity:1;

                transform:translateY(0);

            }

            to{

                opacity:0;

                transform:translateY(-80px);

            }

        }

        /* =========================
        
           HOUSE
        
        ========================= */

        .house{

            position:absolute;

            bottom:0;

            left:42%;

            transform:translateX(-50%);

        }

        .roof{

            width:0;

            height:0;

            border-left:90px solid transparent;

            border-right:90px solid transparent;

            border-bottom:120px solid #8a551f;

        }

        .house-body{

            width:160px;

            height:130px;

            background:#a62d2d;

        }

        /* =========================
        
           FIXED LAMP POST
        
        ========================= */

        .lamp{

            position:absolute;

            right:28%;

            bottom:0;

        }

        .pole{

            width:18px;

            height:330px;

            background:#ddd;

        }

        .arm{

            position:absolute;

            top:0;

            left:-55px;

            width:70px;

            height:12px;

            background:#ddd;

            transform-origin:right center;

            transform:rotate(18deg);

        }

        .head{

            position:absolute;

            left:-70px;

            top:-12px;

            width:32px;

            height:18px;

            background:yellow;

            border-radius:4px;

        }

        .glow{

            position:absolute;

            top:0;

            left:-170px;

            width:260px;

            height:420px;

            background:rgba(255,255,150,.25);

            clip-path:polygon(

                    50% 0%,

                    100% 100%,

                    0% 100%

            );

        }

        /* =========================
        
           SHOP
        
        ========================= */

        .shop{

            position:absolute;

            right:3%;

            top:6%;

            width:22%;

            min-width:220px;

            border:8px solid #ddd;

            background:rgba(255,255,255,.15);

            padding:15px;

        }

        .upgrade{

            background:#ddd;

            font-weight:bold;

            text-align:center;

            padding:25px 10px;

            margin-bottom:12px;

        }

        /* =========================
        
           ROAD
        
        ========================= */

        .road{

            position:relative;

            height:33vh;

            min-height:180px;

            background:#7a7a7a;

            overflow:hidden;

        }

        .lines{

            position:absolute;

            width:100%;

            top:50%;

            transform:translateY(-50%);

            display:flex;

            justify-content:space-around;

        }

        .line{

            width:140px;

            height:24px;

            background:#ddd;

        }

        .car-lane{

            position:absolute;

            inset:0;

        }

        .car{

            position:absolute;

            bottom:35px;

            left:-120px;

            font-size:60px;

            cursor:pointer;

            user-select:none;

            animation:drive 14s linear forwards;

        }

        @keyframes drive{

            from{

                left:-120px;

            }

            to{

                left:110%;

            }

        }

        /* =========================
        
           GRASS
        
        ========================= */

        .grass{

            position:relative;

            height:18vh;

            min-height:120px;

            background:#3f7138;

        }

        /* =========================
        
           SCORE
        
        ========================= */

        .score{

            position:absolute;

            top:15px;

            left:50%;

            transform:translateX(-50%);

            color:white;

            font-size:clamp(20px,2vw,34px);

            font-weight:bold;

        }

        /* =========================
        
           BONUS PANEL
        
        ========================= */

        .bonus-panel{

            position:absolute;

            right:3%;

            bottom:18px;

            border:8px solid #ddd;

            background:rgba(255,255,255,.3);

            width:32%;

            min-width:250px;

            height:110px;

            display:flex;

            justify-content:flex-end;

            align-items:center;

            gap:20px;

            padding:15px;

        }

        .bonus-text{

            background:#ddd;

            padding:10px 20px;

            font-weight:bold;

            min-width:120px;

            text-align:center;

        }

        .car-icon{

            width:80px;

            height:70px;

            background:black;

            display:flex;

            align-items:center;

            justify-content:center;

            color:white;

            font-size:40px;

        }

        @media(max-width:900px){

            .cookie-area{

                width:50%;

            }

            .shop{

                width:35%;

            }

            .car{

                font-size:45px;

            }

            .bonus-panel{

                width:60%;

            }

            .lamp{

                right:20%;

                transform:scale(.8);

                transform-origin:bottom;

            }

        }

        @media(max-width:650px){

            .cookie-area{

                width:65%;

            }

            .shop{

                width:40%;

                min-width:150px;

            }

            .upgrade{

                padding:15px;

                font-size:14px;

            }

            .bonus-panel{

                width:90%;

                right:50%;

                transform:translateX(50%);

            }

            .house{

                transform:translateX(-50%) scale(.8);

            }

            .lamp{

                display:none;

            }

        }

    </style>
</head>
<body>

<div class="game">

    <div class="sky">

        <div class="score">

            Cookies: <span id="cookieCount">0</span>
        </div>

        <div class="cookie-area" id="cookieArea">
            <button class="cookie" id="cookieBtn">🍪</button>
        </div>

        <div class="house">
            <div class="roof"></div>
            <div class="house-body"></div>
        </div>

        <div class="lamp">
            <div class="pole"></div>
            <div class="arm"></div>
            <div class="head"></div>
            <div class="glow"></div>
        </div>

        <div class="shop">
            <div class="upgrade">1+ Per Click</div>
            <div class="upgrade">5+ Per Click</div>
            <div class="upgrade">10+ Per Click</div>
            <div class="upgrade">25+ Per Click</div>
        </div>

    </div>

    <div class="road">

        <div class="lines">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>

        <div id="carLane" class="car-lane"></div>

    </div>

    <div class="grass">

        <div class="bonus-panel">

            <div id="bonusText" class="bonus-text">

                No Bonus
            </div>

            <div class="car-icon">

                🚗
            </div>

        </div>

    </div>

</div>

<script>

    let cookies =

        Number(localStorage.getItem("cookies")) || 0;

    let clickMultiplier = 1;

    let bonusSeconds = 0;

    let bonusInterval;

    const cookieBtn =

        document.getElementById("cookieBtn");

    const cookieCount =

        document.getElementById("cookieCount");

    const cookieArea =

        document.getElementById("cookieArea");

    cookieCount.textContent = cookies;

    /* CLICK COOKIE */

    cookieBtn.addEventListener("click", e => {

        cookies += clickMultiplier;

        cookieCount.textContent = cookies;

        localStorage.setItem(

            "cookies",

            cookies

        );

        cookieBtn.classList.remove("pop");

        void cookieBtn.offsetWidth;

        cookieBtn.classList.add("pop");

        floatText(

            "+" + clickMultiplier,

            e.clientX,

            e.clientY

        );

    });

    /* FLOATING TEXT */

    function floatText(text,x,y){

        const div =

            document.createElement("div");

        div.className = "floating";

        div.textContent = text;

        div.style.left = x + "px";

        div.style.top = y + "px";

        document.body.appendChild(div);

        setTimeout(()=>{

            div.remove();

        },1000);

    }

    /* GOLDEN CAR */

    function spawnCar(){

        const car =

            document.createElement("div");

        car.className = "car";

        const vehicles =

            ["🚗","🚙","🚕","🚓"];

        car.textContent =

            vehicles[

                Math.floor(

                    Math.random()*vehicles.length

                )

                ];

        car.addEventListener(

            "click",

            activateBonus

        );

        document

            .getElementById("carLane")

            .appendChild(car);

        setTimeout(()=>{

            car.remove();

        },14000);

    }

    /* BONUS */

    function activateBonus(){

        clickMultiplier = 2;

        bonusSeconds = 60;

        updateBonus();

        clearInterval(

            bonusInterval

        );

        bonusInterval =

            setInterval(()=>{

                bonusSeconds--;

                updateBonus();

                if(bonusSeconds <= 0){

                    clearInterval(

                        bonusInterval

                    );

                    clickMultiplier = 1;

                    document

                        .getElementById(

                            "bonusText"

                        )

                        .innerHTML =

                        "No Bonus";

                }

            },1000);

        this.remove();

    }

    function updateBonus(){

        document

            .getElementById(

                "bonusText"

            )

            .innerHTML =

            "2x Clicks<br>" +

            bonusSeconds + "s";

    }

    /* RANDOM CAR SPAWNS */

    function scheduleNextCar(){

        const delay =

            30000 +

            Math.random()*60000;

        setTimeout(()=>{

            spawnCar();

            scheduleNextCar();

        },delay);

    }

    scheduleNextCar();

    /* FIRST CAR */

    setTimeout(

        spawnCar,

        5000

    );

</script>

</body>
</html>
