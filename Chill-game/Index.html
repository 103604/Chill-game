<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chill Drive</title>
  <link rel="stylesheet" href="Chill.css">
</head>

<body>

  <!-- GAME WRAPPER -->
  <div id="game">

    <!-- ROAD SCENE -->
    <div id="world">
      <div id="road">
        <div id="lane-markings"></div>
        <div id="light-poles"></div>
      </div>
    </div>

    <!-- CAR HUD / COCKPIT -->
    <div id="cockpit">

      <!-- STEERING WHEEL -->
      <div id="steering-wheel">
        <div id="wheel-inner"></div>
      </div>

      <!-- DASHBOARD -->
      <div id="dashboard">

        <!-- SPEED -->
        <div id="speed-box">
          <div class="label">Speed</div>
          <div id="speed-value">0</div>
          <div class="unit">km/h</div>
        </div>

        <!-- GEAR -->
        <div id="gear-box">
          <div class="label">Gear</div>
          <div id="gear-value">N</div>
        </div>

        <!-- RADIO / VIBE COMPANION -->
        <div id="radio">

          <div id="radio-header">VIBE FM</div>

          <div id="radio-screen">
            <div id="radio-text" class="typing">
              Welcome driver...
            </div>
          </div>

          <div id="radio-controls">
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
          </div>

        </div>

        <!-- ASSISTANT PANEL -->
        <div id="assistant-panel">
          <div id="xp">
            Confidence XP: <span id="xp-value">151</span> / 1000
          </div>
          <div id="confidence-bar">
            <div id="confidence-fill"></div>
          </div>

          <div id="ai-tip">
            Keep your eyes on the road.
          </div>
        </div>

      </div>

    </div>

    <!-- CONTROLS HELP -->
    <div id="controls-help">
      <h3>Controls</h3>
      <p>W = Accelerate</p>
      <p>S = Brake</p>
      <p>A = Left</p>
      <p>D = Right</p>
    </div>

  </div>

  <script src="Chill.js"></script>
</body>
</html>
