<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Road Clicker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <div class="sky">

        <div class="score">
            Cookies: <span id="cookieCount">0</span>
        </div>

        <div class="cookie-box" id="cookieBox">
            <button id="cookieBtn" class="cookie">🍪</button>
        </div>

        <div class="house">
            <div class="roof"></div>
            <div class="home"></div>
        </div>

        <div class="lamp">
            <div class="pole"></div>
            <div class="arm"></div>
            <div class="head"></div>
            <div class="glow"></div>
        </div>

        <div class="shop">
            <div class="up">1+ Per Click</div>
            <div class="up">5+ Per Click</div>
            <div class="up">10+ Per Click</div>
            <div class="up">25+ Per Click</div>
        </div>

    </div>

    <div class="road">

        <div class="line-wrap">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>

        <div id="carLane"></div>

    </div>

    <div class="grass">

        <div class="bonus">

            <div id="bonusText" class="btxt">
                No Bonus
            </div>

            <div class="icon">
                🚗
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
